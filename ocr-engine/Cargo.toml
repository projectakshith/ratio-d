[package]
name = "tinyocr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart", "json"] }
bytes = "1.12.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "tracing",
    "download-binaries",
    "tls-rustls",
    "api-27",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "0.9.8"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
serde_json = "1.0.151"

[features]
default = []
# GPU build: `cargo build --release --features cuda`
cuda = ["ort/cuda"]

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "load_test"
harness = false
